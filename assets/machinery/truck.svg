      <line id="truck-bed-five-divider" x1="392" y1="112" x2="392" y2="304" stroke="#A9B0B5" stroke-width="3" stroke-linecap="round"/>
      <g id="truck-slots">
      <rect id="slot-01" data-slot="1" x="68" y="244" width="56" height="56" rx="8" fill="none" stroke="#30343B" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="8 6"/>
