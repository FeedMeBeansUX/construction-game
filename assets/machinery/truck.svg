<svg xmlns="http://www.w3.org/2000/svg" viewBox="16 80 940 340" width="940" height="340">
  <title>Bouwmeesters – truck (master v0.1)</title>
  <defs>
    <g id="brick">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#C8754B" stroke="#30343B" stroke-width="4"/>
      <rect x="6" y="6" width="44" height="10" rx="5" fill="#E39A70"/>
    </g>
    <g id="brick-new">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#EFB089" stroke="#30343B" stroke-width="4"/>
      <rect x="6" y="6" width="44" height="10" rx="5" fill="#FFFFFF" fill-opacity="0.6"/>
      <circle cx="28" cy="34" r="6" fill="#FFFFFF" stroke="#30343B" stroke-width="2"/>
    </g>
  </defs>

  <g id="truck">
    <rect id="truck-dropzone" x="24" y="72" width="736" height="272" fill="#000" fill-opacity="0"/>

    <rect id="truck-chassis" x="32" y="308" width="900" height="36" rx="14" fill="#ED873A" stroke="#30343B" stroke-width="5"/>

    <g id="truck-cab">
      <rect id="truck-beacon" x="798" y="108" width="28" height="24" rx="10" fill="#ED873A" stroke="#30343B" stroke-width="4"/>
      <path id="truck-cab-body" d="M752 316 V150 Q752 128 774 128 H860 Q884 128 898 148 L916 190 Q920 200 920 212 V316 Z" fill="#F5C542" stroke="#30343B" stroke-width="5" stroke-linejoin="round"/>
      <path id="truck-window" d="M772 150 H866 L884 206 H772 Z" fill="#55B9E8" stroke="#30343B" stroke-width="4" stroke-linejoin="round"/>
      <rect id="truck-window-shine" x="784" y="160" width="10" height="34" rx="5" fill="#FFFFFF" fill-opacity="0.7"/>
      <circle id="truck-headlight" cx="905" cy="280" r="10" fill="#FFFFFF" stroke="#30343B" stroke-width="4"/>
      <rect id="truck-bumper" x="908" y="298" width="32" height="40" rx="10" fill="#30343B"/>
    </g>

    <g id="truck-badge">
