      <rect id="slot-18" data-slot="18" x="532" y="180" width="56" height="56" rx="8" fill="none" stroke="#30343B" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="8 6"/>
      <rect id="slot-19" data-slot="19" x="596" y="180" width="56" height="56" rx="8" fill="none" stroke="#30343B" stroke-opacity="0.6" stroke-width="3" stroke-dasharray="8 6"/>
